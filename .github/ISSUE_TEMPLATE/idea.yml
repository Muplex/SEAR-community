name: Idea
description: A feature you miss, or a way SEAR could work better.
title: "Idea: "
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like SEAR to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The situation where you missed it.
  - type: input
    id: song
    attributes:
      label: Song / rig, if it is about one
